<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HTMHELLPAD</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="mask-icon" href="images/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
</head>

<body>
    <!-- Boot sequence -->
    <div id="boot-screen">
        <div id="boot-log"></div>
    </div>

    <!-- Welcome screen -->
    <div id="welcome-screen" class="hidden">
        <div class="welcome-line welcome-line-top"></div>
        <div class="welcome-content">
            <div class="welcome-scanline"></div>
            <img src="images/helldivers_logo.svg" alt="Helldivers" class="welcome-logo">
            <div class="welcome-text">
                <span class="welcome-title">PERSONAL HELLPAD</span>
                <span class="welcome-title">SYSTEM</span>
            </div>
            <div class="welcome-meta">
                <span>v4.2.1</span>
            </div>
            <div class="welcome-tap">TAP ANYWHERE TO UNLOCK</div>
        </div>
        <div class="welcome-line welcome-line-bottom"></div>
    </div>

    <!-- Main app -->
    <div id="app" class="hidden">
        <div class="blueprint-grid"></div>
        <div id="overlay" class="hidden"></div>
        <div id="stratagem-display" class="hidden">
            <img id="stratagem-logo" src="" alt="Stratagem Logo">
            <h1 id="stratagem-name"></h1>
            <div class="strat-tap-hint">STRATAGEM READY!</div>
        </div>
        <div id="error-display" class="hidden">ERROR</div>

        <div class="app-line app-line-top"></div>

        <div id="app-header">
            <img src="images/helldivers_logo.svg" alt="Helldivers" class="app-logo">
            <div id="sequence-display"></div>
        </div>

        <div id="dpad">
            <div class="dpad-row dpad-row-top">
                <button class="arrow" id="up-arrow" aria-label="Up">
                    <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
                </button>
            </div>
            <div class="dpad-row dpad-row-bottom">
                <button class="arrow" id="left-arrow" aria-label="Left">
                    <svg viewBox="0 0 24 24"><path d="M4 12l8-8v5h8v6h-8v5z"/></svg>
                </button>
                <button class="arrow" id="down-arrow" aria-label="Down">
                    <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-5V4h-6v8H4z"/></svg>
                </button>
                <button class="arrow" id="right-arrow" aria-label="Right">
                    <svg viewBox="0 0 24 24"><path d="M20 12l-8-8v5H4v6h8v5z"/></svg>
                </button>
            </div>
        </div>

        <div class="app-line app-line-bottom"></div>
    </div>

    <script src="lowLag.js"></script>
    <script src="sm2/js/soundmanager2.js"></script>
    <script src="scripts.js"></script>
</body>

</html>
